name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Pest ${{ matrix.pest }}${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            pest: '^3.0'
            update-flags: ''
            label: ''
          - php: '8.3'
            pest: '^4.0'
            update-flags: ''
            label: ''
          - php: '8.4'
            pest: '^4.0'
            update-flags: ''
            label: ''
          - php: '8.5'
            pest: '^4.0'
            update-flags: ''
            label: ''
          - php: '8.2'
            pest: '^3.0'
            update-flags: '--prefer-lowest --prefer-stable'
            label: ' / lowest'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '${{ matrix.php }}'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2
      - name: Select dependency lane
        run: composer require --dev --no-update "pestphp/pest:${{ matrix.pest }}"
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction ${{ matrix.update-flags }}
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: composer check

  coverage:
    name: Coverage (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: intl, mbstring
          coverage: pcov
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: composer test:coverage

  release-smoke:
    name: Release archive smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: composer test:release
